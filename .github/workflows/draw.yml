name: Draw Tempest 34 keymap
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/roba_tempest_34.keymap'
      - 'hardware/layout-points.json'
      - 'boards/shields/roba_tempest_34/roba_tempest_34-layout.dtsi'
      - 'scripts/generate_layout.py'
      - 'scripts/draw_keymap.py'
      - 'keymap_drawer.config.yaml'
      - 'requirements-draw.txt'
      - '.github/workflows/draw.yml'
  pull_request:
    paths:
      - 'config/roba_tempest_34.keymap'
      - 'hardware/layout-points.json'
      - 'boards/shields/roba_tempest_34/roba_tempest_34-layout.dtsi'
      - 'scripts/generate_layout.py'
      - 'scripts/draw_keymap.py'
      - 'keymap_drawer.config.yaml'
      - 'requirements-draw.txt'
      - '.github/workflows/draw.yml'
permissions:
  contents: read
concurrency:
  group: draw-rt34-${{ github.ref }}
  cancel-in-progress: true
jobs:
  draw:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-draw.txt
      - name: Install pinned Keymap Drawer
        run: python -m pip install -r requirements-draw.txt
      - name: Render all layers and check geometry
        run: python scripts/draw_keymap.py
      - name: Upload drawings and source fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: rt34-keymap-drawings
          path: |
            keymap-drawer/roba_tempest_34*.svg
            keymap-drawer/roba_tempest_34.yaml
            keymap-drawer/roba_tempest_34.render.json
      - name: Commit drawings to the same branch
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        env:
          DRAW_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- keymap-drawer/roba_tempest_34*.svg keymap-drawer/roba_tempest_34.yaml keymap-drawer/roba_tempest_34.render.json
          if git diff --cached --quiet; then
            echo 'Drawings already match the keymap.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate Tempest 34 keymap drawings [skip ci]'
          git push origin "HEAD:refs/heads/${DRAW_BRANCH}"
